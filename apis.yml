name: Primesense
description: >-
  PrimeSense was an Israeli fabless semiconductor and 3D-sensing company, best
  known for co-developing the depth-sensing technology behind Microsoft's Kinect
  and for sponsoring the open-source OpenNI (Open Natural Interaction) framework
  and its NiTE middleware for skeleton tracking and gesture recognition. The
  company shipped the PrimeSensor reference design and PS1080 system-on-chip for
  structured-light depth cameras. Apple acquired PrimeSense in November 2013 for
  roughly $360M; the OpenNI project and openni.org were subsequently wound down
  (openni.org now redirects to apple.com) and the company's developer program,
  website, and API/docs hosts are no longer online. Only legacy Apache-2.0
  source repositories (the OpenNI sensor driver and NiTE controls) remain public
  on GitHub. There is no live web/REST API surface for PrimeSense.
